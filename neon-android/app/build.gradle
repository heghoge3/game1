plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neon.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.neon.control'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Ключ лежит в репозитории, чтобы каждая сборка подписывалась одинаково
    // и новые версии ставились поверх старой без удаления.
    signingConfigs {
        release {
            storeFile file('neon.keystore')
            storePassword 'neoncontrol'
            keyAlias 'neon'
            keyPassword 'neoncontrol'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/webassets"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Интерфейс берётся из веб-версии (папка neon/), чтобы не было двух копий
tasks.register('copyWeb', Copy) {
    from '../../neon'
    into "$buildDir/webassets/www"
    exclude 'sw.js', 'README.md'
}
preBuild.dependsOn 'copyWeb'
